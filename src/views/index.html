<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Bot Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; width: 80%; max-width: 500px; }
        h1 { margin-bottom: 1rem; }
        .status { margin-bottom: 2rem; color: #aaa; }
        .controls button { background: #0099ff; border: none; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; font-size: 1rem; }
        .controls button:hover { background: #007acc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Music Bot Dashboard</h1>
        <div id="status" class="status">Loading status...</div>
        <div class="controls">
            <button onclick="control('play_pause')">Play/Pause</button>
            <button onclick="control('skip')">Skip</button>
            <button onclick="control('stop')">Stop</button>
        </div>
    </div>
    <script>
        async function fetchStatus() {
            const res = await fetch('/api/status');
            const data = await res.json();
            const statusDiv = document.getElementById('status');
            if (data.playing) statusDiv.innerText = "Currently Playing: " + data.track;
            else statusDiv.innerText = 'Nothing is playing right now.';
        }
        async function control(action) {
            await fetch("/api/control?action=" + action);
            fetchStatus();
        }
        setInterval(fetchStatus, 3000);
        fetchStatus();
    </script>
</body>
</html>
